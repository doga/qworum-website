text:
  mission:
    oneliner: Qworum is the Web for applications
    usp:
    - Qworum provides advanced browser capabilities to webapps.
    - Integrated user experiences across multiple internal/external webapps.
    - Most secure integration protocol.
    - Supports large-scale webapps involving multiple developer teams. Qworum apps can span multiple websites, one for each team.
    - >
      <a target='_blank' href='{{company.achievements.patent}}'>Patent-based</a> technological breakthrough. 

    valueProposition:
    # - title: The new essential enterprise infrastructure
    #   description: >
    #     <a target='_blank' href='https://www.linkedin.com/posts/dogaarmangil_report-state-of-saas-integrations-2024-activity-7273076432229044224-i2wr'>A recent survey
    #     shows that application integration is <em>key</em> or <em>very important</em>
    #     for 84% of SaaS customers</a>. 
    #     Yet the REST protocol used by most SaaS is 25 years old at this point.
    #     Qworum's interactive and composable APIs are a significant technological breakthrough in application integration.
    - title: 🛡 The new mission-critical software infrastructure
      description: >
        The cost of a data breach is $4M for organisations; that's the world average. In the US it's $10M. Our value proposition is clear: Qworum is the most secure application integration solution on the planet. Today's OAuth-based integrations are security breaches waiting to happen. <a target='_blank' href='https://www.linkedin.com/feed/update/urn:li:activity:7480597447745032192/'>Adopt a Qworum-first integration strategy and gain peace of mind</a>.
    - title: 🌐 Integrated user experiences
      description: >
        Employees today have to juggle with 11 applications on average. End-users often have to manually integrate applications through cut-and-paste and download-and-upload operations. Qworum is the only technology on the planet that enables seamlessly integrated UXes across webapps, supporting dependency graphs of arbitrary complexity between webapps.
    - title: 🤖 AI-ready
      description: >
        Qworum apps are AI-ready, in the sense that they are structured the right way for being piloted by AI. This cannot be said for non-Qworum webapps. Platform-wide AI capability is on our roadmap. Also, Qworum has native support for RDF, an essential data technology for AI.
    - title: With Qworum, the Web is surpassing the mobile and desktop platforms for the first time
      description: >
        Qworum is the only platform to support applications that have distributed frontends. The mobile and desktop platforms, and the baseline "Document Web" itself only support single-node applications.
        <a target='_blank' href='https://drive.google.com/file/d/13xy5Yx8dMVqGiJqqWFhh9DOi_7akl_rW/view'>to overcome the limitations of today's Document Web, Qworum had to invent a new Web variant, including a new linking mechanism and a new browser runtime</a>. 
    - title: Interactive Web APIs
      description: >
        Qworum APIs break new ground with their support for interactivity. Qworum API endpoints can interact with end-users through regular Web pages during a call. Qworum APIs are ideal for user-facing processes, which become much easier to program, because the API brings much of the application user interface with it, enabling UI reuse across applications, across the Web.
    - title: Composable Web APIs
      description: >
        Qworum has defined the only Web API technology that is composable. A Qworum API can call another Qworum API without the user authentication and network timeout problems that are unsolved for the other Web API protocols.
    - title: Easy integrations
      description: >
        Qworum-based integrations are simple to program. Applications can call the Qworum APIs of other applications without any setup phase whatsoever. No need to obtain API keys. No need to implement an OAuth dance to link up the end-user's accounts on both applications. Integrations are about as easy as adding a hyperlink to a website. Except that the link is actually a script.
    - title: Modular and distributed applications
      description: Qworum APIs are a new way of structuring Web application frontends that goes much beyond what frontend frameworks such as ReactJS can do, and complements them.
    - title: Fit for knowledge applications
      description: >
        Qworum supports RDF natively, in addition to JSON. RDF has found widespread use within knowledge-based industries such as pharma, health and biology, cosmetics, food, e-commerce, finance and banking, and the public sector.
    - title: 🛡 Selective disclosure of data
      description: >
        Qworum APIs can return filtered data, based on who the end-user is and which website is calling the API endpoint. Endpoints can also produce derived data, such as whether a person is of legal age. Best of all: doing these on Qworum does not require any heavy-handed cryptographic complexity. Things are easy.
    - title: 🏆 Best-of-breed vs enterprise suites
      description: >
        Qworum helps unlock SaaS innovation by fixing integration. With Qworum, organisations can cherry-pick best-of-breed SaaS. Integration has historically been a weak point for BoB SaaS. Organisations often use multiple SaaS products, so SaaS must have a solid integration story to tell. And Qworum fixes that. Application suite vendors can also become more open by building on Qworum.
    - title: Easy to get started
      description: Use Qworum in production on a piecemeal basis. Add a Qworum API to existing applications just for integrations. Then you can transition your applications to Qworum at your own pace. For greenfield projects, make your application a Qworum application from the start; this will obviate the need for a separate Qworum API.
    # - title: New business opportunity in the B2B space
    #   description: Qworum APIs can be built by third parties on top of public SaaS APIs, and API subscriptions can be sold to SaaS customers and partners.
#    - title: ⎔ An upgrade to the Web platform for application use cases
#      description: >
#        Today's Web is still fundamentally a content platform, despite JavaScript and the ability to sign into websites. Qworum transforms the Web from a platform for personalisable and dynamic content into a proper application platform. To do that, Qworum defines groundbreaking new platform features such as a new browser runtime that complements JavaScript, and a new script-based linking mechanism that addresses application use cases.

